<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="description" content="크레이브 디지털 명함과 이미지 명함을 관리하고 공유하는 페이지">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>CRAVE | 명함 관리</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--line:#333;--muted:#a6a6a6;--text:#f7f7f7;--accent:#d9ff45}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#303030 0,#101010 48%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
main{width:min(100%,520px);margin:0 auto;padding:34px 0 28px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.logo{font-size:27px;font-weight:900;letter-spacing:.16em}.tag{font-size:11px;color:var(--accent);border:1px solid #56651c;border-radius:99px;padding:7px 10px;letter-spacing:.08em}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.16em}.headline{font-size:29px;line-height:1.35;letter-spacing:-.06em;margin:10px 0 9px}.sub{color:var(--muted);font-size:14px;margin:0 0 26px}
.card{background:linear-gradient(145deg,#222,#171717);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0;box-shadow:0 12px 32px #0005}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.type{font-size:18px;font-weight:750;letter-spacing:-.04em}.desc{font-size:13px;color:var(--muted);margin-top:6px}.phone{font-size:14px;font-variant-numeric:tabular-nums;margin-top:13px;letter-spacing:.03em}
.preview{display:block;width:100%;height:auto;border-radius:8px;margin-top:15px;border:1px solid #d9d6cf;background:#f6f4ef}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:1px solid #454545;border-radius:12px;padding:13px 10px;background:#292929;color:#fff;font-weight:700;font-size:13px;text-align:center;text-decoration:none;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#151515}.btn.image{border-color:#aaa69c}.install{width:100%;margin-top:16px;background:transparent;border:1px solid #626262;color:#eee;border-radius:13px;padding:14px;font-weight:650;font-size:14px;cursor:pointer}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:12px 3px 0}.foot{margin-top:38px;border-top:1px solid #292929;padding-top:18px;color:#777;font-size:10px;letter-spacing:.13em}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<meta property="og:type" content="website"><meta property="og:site_name" content="CRAVE"><meta property="og:title" content="CRAVE | 명함 관리"><meta property="og:description" content="신규 고객용·기존 거래처용 디지털 및 이미지 명함 관리">
</head><body><main>
<header class="brand"><div class="logo">CRAVE</div><div class="tag">BUSINESS CARD</div></header>
<div class="eyebrow">DIGITAL CARD MANAGER</div><h1 class="headline">전달할 명함을<br>선택하세요.</h1><p class="sub">디지털 명함과 이미지 명함을 함께 전달할 수 있습니다.</p>
<section class="card" aria-labelledby="new-title">
<div class="card-head"><div><div class="type" id="new-title">신규 고객용</div><div class="desc">처음 방문하는 고객에게 전달</div></div></div>
<div class="phone">010-8460-4185</div>
<img class="preview" src="../cards/new-customer.svg" alt="신규 고객용 CRAVE 이미지 명함 미리보기">
<div class="actions">
<a class="btn primary" href="../new/">디지털 명함 열기</a><button class="btn" type="button" data-copy="../new/">디지털 링크 복사</button>
<button class="btn image" type="button" data-image-share="../cards/new-customer.svg" data-filename="CRAVE-신규고객용.png">이미지 공유</button>
<a class="btn image" href="#" data-image-download="../cards/new-customer.svg" data-filename="CRAVE-신규고객용.png">이미지 저장</a>
</div></section>
<section class="card" aria-labelledby="existing-title">
<div class="card-head"><div><div class="type" id="existing-title">기존 거래처용</div><div class="desc">기존 거래처 및 협력사에 전달</div></div></div>
<div class="phone">010-8640-1001</div>
<img class="preview" src="../cards/existing-partner.svg" alt="기존 거래처용 CRAVE 이미지 명함 미리보기">
<div class="actions">
<a class="btn primary" href="../existing/">디지털 명함 열기</a><button class="btn" type="button" data-copy="../existing/">디지털 링크 복사</button>
<button class="btn image" type="button" data-image-share="../cards/existing-partner.svg" data-filename="CRAVE-기존거래처용.png">이미지 공유</button>
<a class="btn image" href="#" data-image-download="../cards/existing-partner.svg" data-filename="CRAVE-기존거래처용.png">이미지 저장</a>
</div></section>
<button class="install" id="install" type="button">＋ 홈 화면에 앱처럼 추가</button><p class="hint" id="hint" aria-live="polite">이미지 공유가 지원되지 않는 기기에서는 이미지 저장 후 메신저에 첨부하면 됩니다.</p>
<footer class="foot">CRAVE · DIGITAL BUSINESS CARD</footer></main>
<script>
const absolute = path => new URL(path, location.href).href;
document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', async () => {const url=absolute(button.dataset.copy);try{await navigator.clipboard.writeText(url);button.textContent='복사 완료';setTimeout(()=>button.textContent='디지털 링크 복사',1600);}catch{window.prompt('아래 링크를 복사하세요.',url);}}));
async function makePng(path,filename){const response=await fetch(absolute(path));if(!response.ok)throw new Error('image fetch failed');const blob=await response.blob();const bitmap=await createImageBitmap(blob);const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);bitmap.close();const png=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('PNG conversion failed')),'image/png'));return new File([png],filename,{type:'image/png'});}
const cardFiles={};
document.querySelectorAll('[data-image-share],[data-image-download]').forEach(button=>{const path=button.dataset.imageShare||button.dataset.imageDownload;const filename=button.dataset.filename;const key=path; if(!cardFiles[key])cardFiles[key]=makePng(path,filename).catch(error=>{console.error(error);return null;});});
document.querySelectorAll('[data-image-share]').forEach(button=>{const original=button.textContent;const key=button.dataset.imageShare;button.disabled=true;button.textContent='이미지 준비 중';cardFiles[key].then(file=>{button.disabled=false;button.textContent=file?original:'이미지 다시 준비';});button.addEventListener('click',()=>{const file=window.__craveCardFiles?.[key];if(!file){cardFiles[key].then(ready=>{if(ready)downloadCard(ready);else alert('이미지를 준비하지 못했습니다. 페이지를 새로고침해 주세요.');});return;}if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){navigator.share({files:[file],title:'CRAVE 명함'}).catch(error=>{if(error.name!=='AbortError')downloadCard(file);});}else{downloadCard(file);}});});
function downloadCard(file){const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
window.__craveCardFiles={};
Object.keys(cardFiles).forEach(key=>cardFiles[key].then(file=>{window.__craveCardFiles[key]=file;}));
document.querySelectorAll('[data-image-download]').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.imageDownload;cardFiles[key].then(file=>{if(file)downloadCard(file);else alert('PNG 저장에 실패했습니다. 페이지를 새로고침해 주세요.');});}));
let installPrompt;const installButton=document.getElementById('install'),hint=document.getElementById('hint');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
installButton.addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else{hint.textContent='Chrome 메뉴(⋮)에서 “홈 화면에 추가” 또는 “앱 설치”를 선택하세요.';}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
