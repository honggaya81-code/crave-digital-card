<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="description" content="크레이브 공식 디지털 명함 관리 및 공유">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>CRAVE | 명함 관리</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1d1d1f;--line:#38383a;--muted:#a4a4a6;--text:#f7f7f7;--accent:#d9ff45}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -8%,#303033 0,#101010 50%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
main{width:min(100%,520px);margin:0 auto;padding:30px 0 32px}
.brand{font-size:25px;font-weight:900;letter-spacing:.15em;margin:4px 0 27px}
h1{font-size:27px;line-height:1.35;letter-spacing:-.06em;margin:0 0 8px}
.sub{color:var(--muted);font-size:15px;margin:0 0 27px}
.card{background:linear-gradient(145deg,#222224,#171719);border:1px solid var(--line);border-radius:26px;padding:25px 22px 27px;margin:16px 0 22px;box-shadow:0 12px 32px #0005}
.type{font-size:22px;font-weight:800;letter-spacing:-.05em}
.desc{font-size:15px;color:var(--muted);margin-top:10px}
.phone{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-top:35px;margin-bottom:27px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.btn{min-height:66px;border:1px solid #454547;border-radius:19px;background:#29292b;color:#fff;font-weight:750;font-size:17px;text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#151515}
.btn:active,.install:active{transform:scale(.985)}
.install{width:100%;min-height:82px;margin-top:32px;background:transparent;border:1px solid #68686a;color:#f1f1f1;border-radius:22px;font-size:19px;font-weight:750;font-family:inherit}
.hint{font-size:14px;line-height:1.7;color:var(--muted);margin:14px 4px 0}
.status{min-height:22px;color:var(--accent);font-size:12px;margin:8px 4px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="CRAVE">
<meta property="og:title" content="CRAVE | 공식 디지털 명함">
<meta property="og:description" content="신규 고객용·기존 거래처용 공식 디지털 명함을 선택하고 전달하세요.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="CRAVE | 공식 디지털 명함">
<meta name="twitter:description" content="신규 고객용·기존 거래처용 공식 디지털 명함을 선택하고 전달하세요.">
</head>
<body>
<main>
<header class="brand">CRAVE</header>
<h1>전달할 명함을 선택하세요.</h1>
<p class="sub">열기 · 링크 복사 · 바로 전달</p>

<section class="card" aria-labelledby="new-title">
<div class="type" id="new-title">신규 고객용</div>
<div class="desc">처음 방문하는 고객에게 전달</div>
<div class="phone">010-8460-4185</div>
<div class="actions">
<a class="btn primary" href="../new/">명함 열기</a>
<button class="btn" type="button" data-copy="new">링크 복사</button>
<button class="btn" type="button" data-share="new">바로 전달</button>
<a class="btn" href="tel:01084604185">전화 걸기</a>
</div>
</section>

<section class="card" aria-labelledby="existing-title">
<div class="type" id="existing-title">기존 거래처용</div>
<div class="desc">기존 거래처 및 협력사에 전달</div>
<div class="phone">010-8640-1001</div>
<div class="actions">
<a class="btn primary" href="../existing/">명함 열기</a>
<button class="btn" type="button" data-copy="existing">링크 복사</button>
<button class="btn" type="button" data-share="existing">바로 전달</button>
<a class="btn" href="tel:01086401001">전화 걸기</a>
</div>
</section>

<button class="install" id="install" type="button">＋ 홈 화면에 앱처럼 추가</button>
<p class="hint">홈 화면에 추가해 두면 다음부터 주소를 찾지 않고 바로 열 수 있습니다.</p>
<p class="status" id="status" aria-live="polite"></p>
</main>
<script>
const cardLinks={
 new:{url:new URL('../new/',location.href).href,title:'신규 고객용'},
 existing:{url:new URL('../existing/',location.href).href,title:'기존 거래처용'}
};
const statusEl=document.getElementById('status');
document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{
 const item=cardLinks[button.dataset.copy];
 try{await navigator.clipboard.writeText(item.url);button.textContent='복사 완료';setTimeout(()=>button.textContent='링크 복사',1600);}
 catch{window.prompt('아래 링크를 복사하세요.',item.url);}
}));
document.querySelectorAll('[data-share]').forEach(button=>button.addEventListener('click',async()=>{
 const item=cardLinks[button.dataset.share];
 if(navigator.share){
  try{await navigator.share({title:'CRAVE 공식 디지털 명함',text:item.title+' · CRAVE 공식 디지털 명함',url:item.url});}
  catch(error){if(error.name!=='AbortError')statusEl.textContent='공유를 완료하지 못했습니다.';}
 }else{
  try{await navigator.clipboard.writeText(item.url);statusEl.textContent='이 기기는 바로 전달을 지원하지 않아 링크를 복사했습니다.';}
  catch{window.prompt('아래 링크를 복사해 전달하세요.',item.url);}
 }
}));
let installPrompt;
const installButton=document.getElementById('install');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});
installButton.addEventListener('click',async()=>{
 if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}
 else{statusEl.textContent='브라우저 메뉴(⋮)에서 “홈 화면에 추가”를 선택하세요.';}
});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=8',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{}));
</script>
</body>
</html>
