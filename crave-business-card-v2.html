body{display:grid;place-items:center;padding:28px}
.card{position:relative;width:min(100%,1080px);aspect-ratio:1.714/1;overflow:hidden;background:linear-gradient(115deg,#202225 0%,#141619 58%,#101214 100%);border:1px solid #414449;box-shadow:0 28px 90px #0009;display:grid;grid-template-columns:43% 57%;padding:7.2% 7.5%}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:#c92e35}
.left{display:flex;flex-direction:column;justify-content:center;padding-right:9%;border-right:1px solid #45484b}
.logo{width:100%;max-width:390px;height:auto;object-fit:contain;filter:drop-shadow(0 8px 18px #0006)}
.tag{margin-top:26px;font-size:clamp(10px,1.35vw,16px);font-weight:600;letter-spacing:.29em;color:#c9cdd1}
.right{display:flex;flex-direction:column;justify-content:center;padding-left:11%}

.name{font-size:clamp(28px,4vw,48px);font-weight:750;letter-spacing:.08em;line-height:1.1}
.role{font-size:clamp(12px,1.5vw,18px);color:#c7c9cc;letter-spacing:.24em;margin:10px 0 30px}

.info{display:grid;grid-template-columns:52px 1fr;gap:10px 14px;align-items:start;font-size:clamp(10px,1.2vw,14px);line-height:1.55}
.label{color:#969ba0;letter-spacing:.12em;font-size:.86em;padding-top:2px}
.value{color:#f0f1f2;letter-spacing:.035em}
.phone{font-size:clamp(15px,2vw,23px);font-weight:650;letter-spacing:.08em}
.services{position:absolute;left:7.5%;right:7.5%;bottom:6.2%;border-top:1px solid #3b3e42;padding-top:17px;display:flex;justify-content:space-between;align-items:center;color:#d4d6d8;font-size:clamp(9px,1.1vw,13px);letter-spacing:.17em}
.services b{color:#c92e35;font-weight:700;margin:0 8px}
@media(max-width:600px){body{padding:12px}.card{padding:7% 6%;grid-template-columns:39% 61%}.left{padding-right:8%}.right{padding-left:8%}.tag{letter-spacing:.12em;margin-top:12px}.role{margin:7px 0 14px}.kicker{margin-bottom:9px}.rule{margin-bottom:12px}.info{grid-template-columns:34px 1fr;gap:6px 7px}.services{left:6%;right:6%;bottom:5%;padding-top:9px;letter-spacing:.08em}}
@media print{html,body{background:#fff;padding:0}.card{width:1800px;height:1050px;max-width:none;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
